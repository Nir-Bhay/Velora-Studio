<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Films · To-Do List</title>
    <style>
        :root { --bg: #1e1e1e; --panel: #262626; --line: #3a3a3a; --text: #fff; --dim: #a9a9a9; --accent: #f5b544; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
                 max-width: 1180px; margin: 0 auto; padding: 28px 20px 8px; }
        h1 { margin: 0; font-size: 26px; }
        h1 span { color: var(--accent); }
        a.back { color: var(--dim); text-decoration: none; border: 1px solid var(--line); padding: 8px 14px; border-radius: 6px; }
        a.back:hover { color: var(--text); border-color: var(--dim); }
        main { max-width: 1180px; margin: 0 auto; padding: 12px 20px 40px; display: grid; gap: 28px; }
        .film { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px;
                display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: start; }
        .film.portrait { grid-template-columns: minmax(0, 340px) minmax(0, 1fr); }
        .player { background: #000; border-radius: 8px; overflow: hidden; }
        .player video { display: block; width: 100%; height: auto; max-height: 80vh; background: #000; }
        .kind { color: var(--accent); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
        h2 { margin: 6px 0 10px; font-size: 22px; }
        .summary { color: #ddd; line-height: 1.5; margin: 0 0 14px; }
        .specs { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-wrap: wrap; gap: 8px; }
        .specs li { font-size: 12px; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
        h3 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 0 0 8px; }
        .chapters { display: grid; gap: 6px; }
        .chapters button { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 10px;
                           text-align: left; background: #1d1d1d; color: var(--text); border: 1px solid var(--line);
                           border-radius: 6px; padding: 9px 12px; cursor: pointer; font: inherit; }
        .chapters button:hover { border-color: var(--dim); }
        .chapters button.on { border-color: var(--accent); }
        .chapters .time { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 13px; }
        .chapters .len { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
        .note { color: var(--dim); font-size: 13px; margin: 14px 0 0; }
        .empty { color: var(--dim); }
        .error { color: #ff8a80; }
        footer { color: var(--dim); font-size: 12px; text-align: center; padding-bottom: 30px; }
        code { color: #ccc; }
        @media (max-width: 820px) {
            .film, .film.portrait { grid-template-columns: 1fr; }
            .film.portrait .player { max-width: 360px; margin: 0 auto; }
        }
    </style>
</head>

<body>
    <header>
        <h1>Films <span>·</span> preview</h1>
        <a class="back" href="index.html">← Back to the To-Do list</a>
    </header>

    <main id="films">
        <p class="empty">Loading films…</p>
    </main>

    <footer>
        Listed from <code>films-manifest.json</code>, which is generated by <code>scripts/build-films-manifest.mjs</code>.
    </footer>

    <script>
        // Relative URLs only, so this works through the preview proxy and on any host.
        const fmt = (s) => {
            const m = Math.floor(s / 60), r = s - m * 60;
            return `${m}:${r.toFixed(2).padStart(5, '0')}`;
        };
        const el = (tag, props = {}, kids = []) => {
            const n = document.createElement(tag);
            Object.assign(n, props);
            for (const k of kids) n.append(k);
            return n;
        };

        function buildFilm(f) {
            const video = el('video', { controls: true, playsInline: true, preload: 'metadata', poster: f.poster || '' });
            video.src = f.src;
            video.setAttribute('aria-label', f.title);

            const player = el('div', { className: 'player' }, [video]);
            const isPortrait = f.aspect === '9:16';
            if (f.aspect) video.style.aspectRatio = f.aspect.replace(':', ' / ');

            const buttons = f.chapters.map((c) => {
                const b = el('button', { type: 'button' }, [
                    el('span', { className: 'time', textContent: fmt(c.t0) }),
                    el('span', { textContent: c.label }),
                    el('span', { className: 'len', textContent: `${(c.t1 - c.t0).toFixed(1)} s` }),
                ]);
                b.addEventListener('click', () => {
                    const go = () => { video.currentTime = c.t0; video.play().catch(() => {}); };
                    if (video.readyState >= 1) go(); else video.addEventListener('loadedmetadata', go, { once: true });
                });
                return { el: b, c };
            });

            // Highlight the chapter under the playhead.
            video.addEventListener('timeupdate', () => {
                const t = video.currentTime;
                for (const { el: b, c } of buttons) b.classList.toggle('on', t >= c.t0 && t < c.t1);
            });

            const specs = el('ul', { className: 'specs' }, f.specs.map((s) => el('li', { textContent: s })));
            const body = el('div', {}, [
                el('div', { className: 'kind', textContent: f.kind }),
                el('h2', { textContent: f.title }),
                el('p', { className: 'summary', textContent: f.summary }),
                specs,
                el('h3', { textContent: 'Chapters · click to jump' }),
                el('div', { className: 'chapters' }, buttons.map((b) => b.el)),
                el('p', { className: 'note', textContent: f.voiceNote || '' }),
            ]);

            return el('section', { className: `film${isPortrait ? ' portrait' : ''}` }, [player, body]);
        }

        (async function init() {
            const host = document.getElementById('films');
            try {
                const res = await fetch('films-manifest.json', { cache: 'no-cache' });
                if (!res.ok) throw new Error(`manifest ${res.status}`);
                const data = await res.json();
                host.replaceChildren(...data.films.map(buildFilm));
            } catch (err) {
                host.replaceChildren(el('p', { className: 'error', textContent: `Could not load the films (${err.message}). Run: node scripts/build-films-manifest.mjs` }));
            }
        })();
    </script>
</body>

</html>
